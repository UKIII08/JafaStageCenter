{# Wspólny panel: wygląd (motyw, per-urządzenie) + język (per-sesja).
   Dostępny dla każdego zalogowanego (ustawienia = admin, profil = każdy). #}
<div class="panel" style="max-width:560px;">
    <div class="section-title">{{ _('Appearance & language') }}</div>

    <div class="set-row">
        <span>{{ _('Theme') }}</span>
        <div class="seg" id="theme-seg">
            <button type="button" data-theme-val="light" onclick="setTheme('light')">{{ _('Light') }}</button>
            <button type="button" data-theme-val="dark" onclick="setTheme('dark')">{{ _('Dark') }}</button>
        </div>
    </div>

    <div class="set-row">
        <span>{{ _('Language') }}</span>
        <select style="min-width:160px;" onchange="if(this.value)location.href=this.value;">
            {% for code, label in languages %}
            <option value="{{ url_for('switch_lang', code=code) }}" {{ 'selected' if current_lang() == code }}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<script>
function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('jonathan-theme', t); } catch (e) {}
    document.querySelectorAll('#theme-seg button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-theme-val') === t);
    });
}
// oznacz aktywny motyw przy wejściu
setTheme(document.documentElement.getAttribute('data-theme') || 'dark');
</script>
