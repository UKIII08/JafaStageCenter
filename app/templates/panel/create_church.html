{% extends 'base.html' %}
{% block content %}
<div class="shell-narrow">
    <div class="panel">
        <h2>Załóż wspólnotę</h2>
        <p class="hint">Utworzysz przestrzeń dla swojego zespołu — piosenki,
        setlisty i profile muzyków.</p>
        <form method="POST">
            <label>Nazwa wspólnoty / zboru</label>
            <input name="name" required minlength="3" placeholder="np. Zbór Betania Warszawa" autofocus>
            <div style="margin-top:var(--s4);"><button type="submit">Utwórz</button></div>
        </form>
    </div>
</div>
{% endblock %}
