{% extends 'base.html' %}
{% block title %}Ustawienia — {{ church.name }}{% endblock %}
{% block content %}
<div class="panel" style="max-width:560px;">
    <h2>Ustawienia wspólnoty</h2>
    <form method="POST">
        <label>Nazwa wspólnoty</label>
        <input name="name" value="{{ church.name }}" minlength="3" required>
        <label>Domyślna notacja akordów</label>
        <select name="default_notation">
            <option value="international" {% if church.settings.get('default_notation','international') == 'international' %}selected{% endif %}>Międzynarodowa (Bb, B)</option>
            <option value="polish" {% if church.settings.get('default_notation') == 'polish' %}selected{% endif %}>Polska (B, H, Cis, Fis)</option>
        </select>
        <label>Silnik przejść między piosenkami</label>
        <select name="transition_engine">
            <option value="v4" {% if church.settings.get('transition_engine','v4') == 'v4' %}selected{% endif %}>Kontekstowy (zalecany)</option>
            <option value="v3" {% if church.settings.get('transition_engine') == 'v3' %}selected{% endif %}>Pivot Pro</option>
            <option value="v2" {% if church.settings.get('transition_engine') == 'v2' %}selected{% endif %}>Advanced</option>
        </select>
        <div style="margin-top:var(--s4);"><button type="submit">Zapisz</button></div>
    </form>
</div>
{% endblock %}
