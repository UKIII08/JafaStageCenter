<!DOCTYPE html>
<html>
<head>
    {% include '_favicon.html' %}
    <title>Presenter View</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script>
        // Web: zawężenie do wspólnoty — patrz studio/control.html
        window.JAFA_BASE = {{ base|tojson }};
        window.JAFA_MEDIA = {{ media|tojson }};
        window.CHURCH_ID = {{ church_id|tojson }};
        window.SCREEN_TOKEN = {{ screen_token|tojson }};
        (function () {
            var of = window.fetch.bind(window);
            window.fetch = function (u, o) {
                if (typeof u === 'string' && u.charAt(0) === '/' && u.indexOf('//') !== 0) {
                    if (u.indexOf('/static/pads/') === 0) u = window.JAFA_MEDIA + u.slice('/static'.length);
                    else if (u.indexOf('/static/') !== 0 && u.indexOf(window.JAFA_BASE) !== 0) {
                        u = window.JAFA_BASE + u;
                        if (window.SCREEN_TOKEN) u += (u.indexOf('?') === -1 ? '?' : '&') + 'token=' + encodeURIComponent(window.SCREEN_TOKEN);
                    }
                }
                return of(u, o);
            };
        })();
    </script>
    <script src="{{ url_for('static', filename='socket.io.js') }}"></script>
    <script>
        (function () {
            var orig = window.io;
            window.io = function () {
                var s = orig.apply(null, arguments);
                var oe = s.emit.bind(s);
                s.emit = function (ev, data) {
                    var rest = Array.prototype.slice.call(arguments, 2);
                    if (data === undefined || data === null) data = {};
                    if (typeof data === 'object' && !Array.isArray(data)) {
                        data.church_id = window.CHURCH_ID;
                        if (window.SCREEN_TOKEN) data.token = window.SCREEN_TOKEN;
                    }
                    return oe.apply(null, [ev, data].concat(rest));
                };
                s.on('connect', function () { oe('join_live', {church_id: window.CHURCH_ID, token: window.SCREEN_TOKEN || null}); });
                return s;
            };
        })();
    </script>
    <style>
        body {
            margin: 0;
            background: var(--bg-app);
            color: var(--text-primary);
            font-family: 'Sen', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-view {
            width: 70%;
            display: flex;
            flex-direction: column;
            padding: var(--s5);
            box-sizing: border-box;
        }
        .current-slide-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: var(--r-lg);
            overflow: hidden;
        }
        #current-slide-img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .sidebar {
            width: 30%;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-default);
            display: flex;
            flex-direction: column;
            padding: var(--s5);
            box-sizing: border-box;
        }

        .timer-box { text-align: center; margin-bottom: var(--s5); }
        #clock { font-size: 3vh; color: var(--text-secondary); margin-bottom: var(--s3); }
        #conf-timer { font-size: 8vh; font-weight: 900; font-family: monospace; }

        .next-slide-container { flex-grow: 1; display: flex; flex-direction: column; }
        .next-label {
            color: var(--red);
            font-weight: 700;
            font-size: var(--font-sm);
            margin-bottom: var(--s3);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .next-preview {
            flex-grow: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: var(--r-md);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #next-slide-img { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0.7; }

        #conf-message {
            background: var(--amber);
            color: var(--text-inverse);
            padding: var(--s4);
            border-radius: var(--r-md);
            font-weight: 700;
            font-size: 3vh;
            text-align: center;
            margin-top: var(--s5);
            display: none;
        }

        .current-slide-container { position: relative; cursor: pointer; }
        .pres-nav { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s4); }
        .pres-nav button {
            flex: 1; height: 9vh; min-height: 56px; font: 700 3.2vh 'Sen', sans-serif;
            background: var(--bg-surface); color: var(--text-primary);
            border: 1px solid var(--border-strong, var(--border-default)); border-radius: var(--r-lg);
            cursor: pointer; touch-action: manipulation;
        }
        .pres-nav button:hover { border-color: var(--accent, #4F7FFF); }
        .pres-nav button:active { transform: scale(0.98); }
        .pres-nav button:disabled { opacity: 0.35; cursor: default; }
        #pres-next { background: var(--accent, #4F7FFF); border-color: var(--accent, #4F7FFF); color: #fff; }
        #pres-counter { min-width: 7ch; text-align: center; font: 700 3vh monospace; color: var(--text-secondary); }

        .pres-header {
            margin: 0 0 var(--s3);
            color: var(--text-tertiary);
            font-size: var(--font-xs);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="main-view">
        <h2 class="pres-header" data-t="pres_current">AKTUALNY SLAJD</h2>
        <div class="current-slide-container" id="current-slide-box" title="Klik: następny slajd">
            <img id="current-slide-img" src="" style="display:none;">
            <h1 id="placeholder-text" style="color:var(--text-muted);" data-t="pres_waiting">Oczekiwanie na prezentację...</h1>
        </div>
        <div class="pres-nav" id="pres-nav" hidden>
            <button type="button" id="pres-prev" aria-label="Poprzedni slajd">←</button>
            <span id="pres-counter"></span>
            <button type="button" id="pres-next" aria-label="Następny slajd">→</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="timer-box">
            <div id="clock">00:00</div>
            <div id="conf-timer" style="color: white;">00:00</div>
        </div>

        <div class="next-slide-container">
            <div class="next-label" data-t="pres_next">NASTĘPNY SLAJD ➔</div>
            <div class="next-preview">
                <img id="next-slide-img" src="" style="display:none;">
            </div>
        </div>

        <div id="conf-message"></div>
    </div>

    <script>
        var socket = io();

        // Zegar czasu rzeczywistego
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        socket.on('update_slide', function(data) {
            const currentImg = document.getElementById('current-slide-img');
            const nextImg = document.getElementById('next-slide-img');
            const placeholder = document.getElementById('placeholder-text');

            // Aktualizacja timera i wiadomości (przychodzą w każdym pakiecie konferencyjnym)
            if (data.timer) {
                document.getElementById('conf-timer').innerText = data.timer;
                document.getElementById('conf-timer').style.color = data.timer_color;
            }
            if (data.message) {
                document.getElementById('conf-message').innerText = data.message;
                document.getElementById('conf-message').style.display = 'block';
            } else {
                document.getElementById('conf-message').style.display = 'none';
            }

            if (data.mode === 'presentation') {
                placeholder.style.display = 'none';
                currentImg.style.display = 'block';
                currentImg.src = data.slide_url;

                if (data.next_slide_url) {
                    nextImg.style.display = 'block';
                    nextImg.src = data.next_slide_url;
                } else {
                    nextImg.style.display = 'none';
                }
            }
            else if (data.mode === 'canva') {
                currentImg.style.display = 'none';
                nextImg.style.display = 'none';
                placeholder.style.display = 'block';
                placeholder.innerText = t('pres_canva_msg');
            }
            else if (data.mode === 'conference') {
                // Tryb zegara: pokazujemy tylko odliczanie + wiadomość (są wyżej),
                // bez brzydkiego napisu „MODE: CONFERENCE".
                currentImg.style.display = 'none';
                nextImg.style.display = 'none';
                placeholder.style.display = 'none';
            }
            else {
                currentImg.style.display = 'none';
                nextImg.style.display = 'none';
                placeholder.style.display = 'block';
                placeholder.innerText = t('pres_mode') + " " + data.mode.toUpperCase();
            }
        });

        // Osobny, lekki kanał zegara/wiadomości mówcy (nie rusza prezentacji).
        socket.on('timer_update', function(data) {
            if (data.timer !== undefined) {
                document.getElementById('conf-timer').innerText = data.timer;
                document.getElementById('conf-timer').style.color =
                    (data.timer_color === 'red') ? 'var(--red, #F87171)' : 'white';
            }
            var msgEl = document.getElementById('conf-message');
            if (data.message) { msgEl.innerText = data.message; msgEl.style.display = 'block'; }
            else { msgEl.style.display = 'none'; }
        });

        // ── Przełączanie slajdów z widoku prezentera ──
        // Prezenter nie zna listy slajdów: prosi panel sterowania (przez serwer),
        // a panel wysyła nowy slajd na wszystkie ekrany.
        var presActive = false, presIdx = 0, presTotal = 0, presId = '';
        function presNav(dir) {
            if (!presActive) return;
            if (dir < 0 && presIdx <= 1) return;
            if (dir > 0 && presTotal && presIdx >= presTotal) return;
            socket.emit('presenter_nav', { dir: dir, pres_id: presId, at: presIdx });
        }
        function presUpdateNav(data) {
            presActive = data.mode === 'presentation';
            document.getElementById('pres-nav').hidden = !presActive;
            if (!presActive) return;
            presIdx = data.slide_index || 0;
            presTotal = data.slide_total || 0;
            presId = data.pres_id ? String(data.pres_id) : '';
            document.getElementById('pres-counter').innerText = presTotal ? (presIdx + ' / ' + presTotal) : '';
            document.getElementById('pres-prev').disabled = presIdx <= 1;
            document.getElementById('pres-next').disabled = !!presTotal && presIdx >= presTotal;
        }
        socket.on('update_slide', presUpdateNav);
        document.getElementById('pres-prev').onclick = function () { presNav(-1); };
        document.getElementById('pres-next').onclick = function () { presNav(1); };
        document.getElementById('current-slide-box').onclick = function () { presNav(1); };
        // klawiatura i piloty do prezentacji (wysyłają strzałki / PageUp / PageDown)
        document.addEventListener('keydown', function (e) {
            var k = e.key;
            if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); presNav(1); }
            else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); presNav(-1); }
        });
        // przesunięcie palcem na tablecie
        var touchX = null;
        document.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
        document.addEventListener('touchend', function (e) {
            if (touchX === null) return;
            var dx = e.changedTouches[0].clientX - touchX; touchX = null;
            if (Math.abs(dx) > 60) presNav(dx < 0 ? 1 : -1);
        });

        socket.on('apply_settings', function(data) {
            if (data.lang) {
                initI18n(data.lang);
            }
        });

        // Initialize translations
        initI18n();
    </script>
</body>
</html>
