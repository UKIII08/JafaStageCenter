{% extends 'base.html' %}
{% block content %}
<div class="shell-narrow">
    <div class="panel">
        <h2>Weryfikacja dwuetapowa</h2>
        <p class="hint">Wpisz 6-cyfrowy kod z aplikacji uwierzytelniającej.</p>
        <form method="POST">
            <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus>
            <div style="margin-top:var(--s4);"><button type="submit">Zaloguj</button></div>
        </form>
    </div>
</div>
{% endblock %}
