{% extends 'base.html' %}
{% block title %}Logowanie — Jonathan App{% endblock %}
{% block content %}
<div class="shell-narrow">
    <div class="panel">
        <h2>Zaloguj się</h2>
        <form method="POST">
            <label>E-mail</label>
            <input name="email" type="email" required autofocus>
            <label>Hasło</label>
            <input name="password" type="password" required>
            <div style="margin-top:var(--s4);"><button type="submit">Zaloguj</button></div>
        </form>
        <p class="muted" style="margin-bottom:0;">
            <a href="{{ url_for('auth.register') }}" style="color:var(--accent);">Załóż konto</a>
            &nbsp;·&nbsp;
            <a href="{{ url_for('auth.reset_request') }}" style="color:var(--accent);">Nie pamiętam hasła</a>
        </p>
    </div>
</div>
{% endblock %}
