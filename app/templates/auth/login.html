{% extends 'auth/base_auth.html' %}
{% block title %}{{ _('Log in — Jonathan App') }}{% endblock %}
{% block content %}
<h1>{{ _('Log in') }}</h1>
<p class="sub">{{ _('Come back to your team.') }}</p>
<form method="POST">
    <div class="field"><label>{{ _('E-mail') }}</label><input name="email" type="email" required autofocus autocomplete="email"></div>
    <div class="field"><label>{{ _('Password') }}</label><input name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn-primary" type="submit">{{ _('Log in') }}</button>
</form>
<p class="auth-alt"><a href="{{ url_for('auth.register') }}">{{ _('Create account') }}</a><span class="dot">·</span><a href="{{ url_for('auth.reset_request') }}">{{ _('Forgot password') }}</a></p>
{% endblock %}
