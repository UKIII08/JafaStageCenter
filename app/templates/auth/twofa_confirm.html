{% extends 'base.html' %}
{% block content %}
<div class="panel" style="max-width:520px;">
    <h2>Skonfiguruj 2FA</h2>
    <p class="hint">1. Zeskanuj kod aplikacją uwierzytelniającą.<br>
       2. Wpisz 6-cyfrowy kod, aby potwierdzić.</p>
    <div class="qr-box">
        <img src="data:image/svg+xml;base64,{{ qr_svg }}" width="200" height="200" alt="Kod QR 2FA">
    </div>
    <p class="muted">Nie możesz zeskanować? Wpisz ręcznie: <code>{{ secret }}</code></p>
    <form method="POST">
        <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
        <div style="margin-top:var(--s3);"><button type="submit">Potwierdź i włącz</button></div>
    </form>
</div>
{% endblock %}
