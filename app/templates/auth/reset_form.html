{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:420px; margin:40px auto;">
    <h2>Nowe hasło</h2>
    <form method="POST">
        <label>Nowe hasło (min. 8 znaków)</label>
        <input name="password" type="password" minlength="8" required>
        <button type="submit">Zapisz nowe hasło</button>
    </form>
</div>
{% endblock %}
