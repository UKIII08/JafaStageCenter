{% extends 'base.html' %}
{% block content %}
<div class="shell-narrow">
    <div class="panel">
        <h2>Nowe hasło</h2>
        <form method="POST">
            <label>Nowe hasło (min. 8 znaków)</label>
            <input name="password" type="password" minlength="8" required autofocus>
            <div style="margin-top:var(--s4);"><button type="submit">Zapisz nowe hasło</button></div>
        </form>
    </div>
</div>
{% endblock %}
