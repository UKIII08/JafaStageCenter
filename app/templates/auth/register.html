{% extends 'base.html' %}
{% block title %}Rejestracja — JafaStage{% endblock %}
{% block content %}
<div class="shell-narrow">
    <div class="panel">
        <h2>Załóż konto</h2>
        <form method="POST">
            <label>Imię (widoczne dla zespołu)</label>
            <input name="display_name" required autofocus>
            <label>E-mail</label>
            <input name="email" type="email" required>
            <label>Hasło (min. 8 znaków)</label>
            <input name="password" type="password" minlength="8" required>
            <div style="margin-top:var(--s4);"><button type="submit">Zarejestruj się</button></div>
        </form>
        <p class="muted" style="margin-bottom:0;">Masz konto?
            <a href="{{ url_for('auth.login') }}" style="color:var(--accent);">Zaloguj się</a></p>
    </div>
</div>
{% endblock %}
