name: Build Worship Piano VST3

# This repository is public, so Actions on standard runners cost nothing and do
# not touch the account's 2000 included minutes - the billing page meters the
# usage and then cancels it with a 100% discount. Earlier runs died because
# GitHub never assigned a machine (runner_id 0, killed at the 15 minute queue
# timeout), which is a capacity problem, not a quota one. So: build on every
# push again, and keep the manual dispatch for mac and Linux binaries.
on:
  push:
    paths:
      - 'WorshipPiano/**'
      - '.github/workflows/worship-piano.yml'
  pull_request:
    paths:
      - 'WorshipPiano/**'
      - '.github/workflows/worship-piano.yml'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build'
        type: choice
        default: windows
        options:
          - windows
          - all

# A superseded run is worthless, and every queued job competes for the same
# runner pool. Cancelling the previous one keeps the queue short enough that the
# current one actually gets a machine.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: WorshipPiano

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # Windows by default: it is what gets installed, and asking for three
        # runners at once is what leaves the queue unserved. Dispatch with
        # "all" when a mac or Linux build is actually wanted.
        os: ${{ fromJSON( inputs.platforms == 'all' && '["windows-latest","macos-latest","ubuntu-latest"]' || '["windows-latest"]' ) }}

    steps:
      - uses: actions/checkout@v4

      - name: Name this platform
        id: plat
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) echo "name=Windows-x64" >> "$GITHUB_OUTPUT" ;;
            macos-latest)   echo "name=macOS"       >> "$GITHUB_OUTPUT" ;;
            *)              echo "name=Linux-x64"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libx11-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libcurl4-openssl-dev ninja-build

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: WorshipPiano/build/_deps
          key: juce-8.0.15-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWORSHIPPIANO_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Renders every factory preset offline and fails the build on NaNs,
      # runaway feedback, silence, or the sampled source not actually playing.
      - name: DSP smoke test
        if: runner.os != 'Windows'
        run: ./build/WorshipPianoRender_artefacts/Release/WorshipPianoRender

      - name: DSP smoke test (Windows)
        if: runner.os == 'Windows'
        run: ./build/WorshipPianoRender_artefacts/Release/WorshipPianoRender.exe

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: JafaWorshipPiano-${{ steps.plat.outputs.name }}
          path: WorshipPiano/build/JafaWorshipPiano_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: JafaWorshipPiano-${{ steps.plat.outputs.name }}-standalone
          path: WorshipPiano/build/JafaWorshipPiano_artefacts/Release/Standalone/
          if-no-files-found: warn
