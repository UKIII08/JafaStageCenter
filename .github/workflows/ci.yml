name: CI
on:
  push:
    branches: [web]
  pull_request:
    branches: [web]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  # Deploy odblokuje się, gdy w Settings -> Secrets repo pojawią się:
  # VPS_HOST, VPS_SSH_KEY (patrz RUNBOOK.md, krok 4)
  deploy:
    needs: test
    if: github.ref == 'refs/heads/web' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/jafastage && git pull --ff-only origin web
            docker compose -f deploy/docker-compose.yml up -d --build
